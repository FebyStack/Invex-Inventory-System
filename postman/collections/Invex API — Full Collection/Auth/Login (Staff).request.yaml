$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "teststaff",
      "password": "staff123"
    }
scripts:
  - type: afterResponse
    code: |-
      const res = pm.response.json();
      if (res.success && res.token) { pm.environment.set('staffToken', res.token); }
    language: text/javascript
order: 2000
