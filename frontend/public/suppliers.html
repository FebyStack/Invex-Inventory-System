<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Suppliers | Invex Inventory</title>
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/sidebar.css" />
  <link rel="stylesheet" href="/css/lists.css" />
  <link rel="stylesheet" href="/css/role-guard.css" />
  <script src="/js/role-guard.js?v=2"></script>
</head>
<body>
  <div id="sidebar-placeholder"></div>

  <main class="main-content">
    <header class="top-header">
      <div class="header-title">
        <div class="header-eyebrow">
          <span class="he-num">03</span>
          <span>Catalog &middot; Vendors</span>
        </div>
        <h1>Suppliers</h1>
        <p>Vendor records, lead times, and procurement contacts</p>
      </div>
      <div class="header-actions">
        <button class="btn btn-accent" id="new-supplier-btn">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New supplier
        </button>
      </div>
    </header>

    <section class="page-shell">
      <!-- Toolbar -->
      <div class="list-toolbar">
        <div class="search">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="search-input" placeholder="Search suppliers…">
        </div>
        <div class="spacer"></div>
        <span class="count"><strong id="filtered-count">0</strong> of <span id="total-count">0</span></span>
      </div>

      <!-- Table -->
      <div class="list-wrap">
        <table class="list-table">
          <thead>
            <tr>
              <th>Supplier</th>
              <th>Contact</th>
              <th>Location</th>
              <th>Phone</th>
              <th class="right"></th>
            </tr>
          </thead>
          <tbody id="suppliers-table-body">
            <tr id="loading-state"><td colspan="5" class="list-loading">Loading suppliers…</td></tr>
          </tbody>
        </table>
      </div>

      <div id="empty-state" class="list-empty" style="display:none;">
        <div class="title">No suppliers yet</div>
        <div>Add your first supplier to start receiving stock.</div>
      </div>
    </section>
  </main>

  <!-- Modal -->
  <div class="modal" id="supplier-modal">
    <div class="modal-content" style="max-width: 620px;">
      <div class="modal-header">
        <h2 id="modal-title">New supplier</h2>
      </div>
      <form id="supplier-form">
        <div class="modal-body">
          <input type="hidden" id="edit-id">

          <div class="form-group">
            <label for="sup-name">Company name</label>
            <input type="text" id="sup-name" class="form-control" required placeholder="e.g. Northwind Electronics">
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
            <div class="form-group">
              <label for="sup-contact">Contact person <span style="color:var(--fg-4);font-weight:400;text-transform:none;letter-spacing:0;">(optional)</span></label>
              <input type="text" id="sup-contact" class="form-control" placeholder="Full name">
            </div>
            <div class="form-group">
              <label for="sup-phone">Phone <span style="color:var(--fg-4);font-weight:400;text-transform:none;letter-spacing:0;">(optional)</span></label>
              <input type="text" id="sup-phone" class="form-control" placeholder="+63 912 345 6789">
            </div>
          </div>

          <div class="form-group">
            <label for="sup-email">Email <span style="color:var(--fg-4);font-weight:400;text-transform:none;letter-spacing:0;">(optional)</span></label>
            <input type="email" id="sup-email" class="form-control" placeholder="contact@supplier.com">
          </div>

          <details class="address-disclosure" style="margin-top:8px;">
            <summary style="cursor:pointer;font-size:12px;color:var(--fg-3);text-transform:uppercase;letter-spacing:0.06em;padding:8px 0;user-select:none;">
              Add address details (optional)
            </summary>

            <div style="margin-top:12px;">
              <div class="form-group">
                <label for="sup-address">Street address</label>
                <input type="text" id="sup-address" class="form-control" placeholder="Building, street, unit">
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group">
                  <label for="sup-barangay">Barangay</label>
                  <input type="text" id="sup-barangay" class="form-control" placeholder="Barangay">
                </div>
                <div class="form-group">
                  <label for="sup-city">City / Municipality</label>
                  <input type="text" id="sup-city" class="form-control" placeholder="City">
                </div>
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
                <div class="form-group">
                  <label for="sup-province">Province</label>
                  <input type="text" id="sup-province" class="form-control" placeholder="Province">
                </div>
                <div class="form-group">
                  <label for="sup-postal">Postal code</label>
                  <input type="text" id="sup-postal" class="form-control" placeholder="e.g. 6000">
                </div>
              </div>
            </div>
          </details>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/sidebar.js"></script>
  <script src="/js/suppliers.js"></script>
</body>
</html>
